<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #F7F6F1; --card: #FFFFFF; --text: #1E2A22; --muted: #5C6656; --accent: #23854A; --line: #E4E6DC; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0F1A14; --card: #17251D; --text: #EEF3EC; --muted: #9DB0A2; --accent: #5FD08D; --line: #24382C; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.6 Outfit, system-ui, -apple-system, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 34px; font-weight: 800; letter-spacing: -0.5px; margin: 0 0 6px; }
  .muted { color: var(--muted); }
  a.card { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 18px 20px; margin: 14px 0; color: var(--accent); font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<main>
  <h1>Kalo</h1>
  <p class="muted">Compteur de calories et défis pour iPhone</p>
  <a class="card" href="support/">Assistance</a>
  <a class="card" href="confidentialite/">Politique de confidentialité</a>
</main>
</body>
</html>
